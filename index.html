<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="shared/assets/images/avatar.png">
  <title>Sekisungkarak — Widget Overlay For Your Stream</title>
  <meta name="description" content="A collection of overlay widgets for streaming. Loaded as a browser source in OBS — easy to install.">

  <!-- Sharing preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sekisungkarak">
  <meta property="og:title" content="Widget Overlay For Your Stream">
  <meta property="og:description" content="A collection of overlay widgets for streaming. Loaded as a browser source in OBS — easy to install.">
  <meta property="og:image" content="https://sekisungkarak.github.io/shared/assets/images/og-banner.png">
  <!-- Left stripe of the Discord embed. -->
  <meta name="theme-color" content="#D4A843">
  <meta name="twitter:card" content="summary">

  <!-- Shared marks, fetched alongside the HTML so nothing pops in later. -->
  <link rel="preload" as="image" href="shared/assets/images/tiktok/logo-tiktok.svg">
  <link rel="preload" as="image" href="shared/assets/images/avatar.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="shared/css/global.css">
  <link rel="stylesheet" href="shared/css/atmosphere.css">
  <link rel="stylesheet" href="shared/css/chrome.css?v=5">
  <link rel="stylesheet" href="shared/core/home/home.css">
  <!-- Theme before first paint: the same key chrome.js reads, so the page never
       flashes the wrong ground. Dark is the default when nothing is stored. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sk-theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Only the hero copy lives here. Every card comes from shared/core/catalog.js. -->
  <script type="application/json" id="homeBoot">
  {
    "eyebrow": "WIDGET OVERLAY",
    "title": "Widget Overlay For Your Stream",
    "lede": "A collection of overlay widgets for streaming. Loaded as a browser source in OBS — easy to install."
  }
  </script>

  <script src="shared/core/catalog.js?v=2"></script>
  <script src="shared/core/site.js?v=3"></script>
  <script src="shared/core/i18n.js?v=5"></script>
  <script src="shared/core/chrome.js?v=4"></script>
  <script src="shared/core/home/home.js?v=3"></script>
  <script src="shared/core/search.js?v=2"></script>
  <script src="shared/core/nav.js"></script>
</body>
</html>
