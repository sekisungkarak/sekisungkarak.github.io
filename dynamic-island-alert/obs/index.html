<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<link rel="shortcut icon" href="../../resources/logo/sekisungkarak_logo.png" type="image/jpeg" />
	<link rel="stylesheet" href="./style.css?v=obs80" />
	<script src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/id.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/node-vibrant/3.1.6/vibrant.min.js"></script>
</head>

<body>
	<svg width="0" height="0" style="position: absolute; pointer-events: none;">
		<!-- Liquid Glass Master.dev Demo Filter -->
		<filter id="liquid-glass" color-interpolation-filters="sRGB">
			<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
			<feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" result="displaced" />
			<feGaussianBlur in="displaced" stdDeviation="15" result="blur" />
			<feColorMatrix type="saturate" values="1.2" />
		</filter>
	</svg>
		<div id="dynamicIsland" class="island island-no-panel">
		<div id="islandTopRow">
			<img id="islandAvatar" class="avatar hidden" src="" alt="Avatar">
			<div id="islandIconWrap">
				<img id="islandIcon" class="icon" src="" alt="">
				<div id="islandPauseOverlay">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
					</svg>
				</div>
			</div>
			<div id="islandContent" class="content">
				<span id="islandText" class="text">Loading...</span>
				<span id="islandSubtext" class="subtext hidden"></span>
			</div>
			<img id="islandEventIcon" class="event-icon hidden" src="" alt="">
		</div>
		<div id="musicBigExtra" class="hidden">
			<div class="scrubber">
				<span class="scrub-time" id="scrubberCurrent">1:40</span>
				<div class="scrub-bar"><div class="scrub-fill"></div><div class="scrub-thumb"></div></div>
				<span class="scrub-time" id="scrubberTotal">3:20</span>
			</div>
			<div class="music-controls">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.7 0l-1.1 1-1.1-1a5.5 5.5 0 0 0-7.8 7.8l1 1 7.9 7.8 7.8-7.9 1-1a5.5 5.5 0 0 0 0-7.7z"></path></svg>
				<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z"></path></svg>
				<svg viewBox="0 0 24 24" fill="currentColor" style="transform: scale(1.5);"><circle cx="12" cy="12" r="10"></circle><g fill="#000"><rect x="8" y="7" width="2.5" height="10" rx="1"></rect><rect x="13.5" y="7" width="2.5" height="10" rx="1"></rect></g></svg>
				<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm14 1h-2v14h2V5z"></path></svg>
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"></path></svg>
			</div>
		</div>
	</div>
	<div id="islandAlert" class="alert hidden">
		<span id="alertIcon"></span>
		<span id="alertText"></span>
	</div>
</body>

<script src="./script.js?v=obs81"></script>
</html>
