<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/shared/assets/images/avatar.png">
  <title>Sekisungkarak — Page not found</title>
  <meta name="robots" content="noindex">

  <!-- Root-absolute on purpose: Pages serves this file for any unknown path, so
       relative URLs would resolve against whatever the visitor typed. -->
  <link rel="preload" as="image" href="/shared/assets/images/tiktok/logo-tiktok.svg">
  <link rel="preload" as="image" href="/shared/assets/images/avatar.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/shared/css/global.css">
  <link rel="stylesheet" href="/shared/css/atmosphere.css">
  <link rel="stylesheet" href="/shared/css/chrome.css?v=5">
  <link rel="stylesheet" href="/shared/core/home/home.css">
  <!-- Theme before first paint: the same key chrome.js reads, so the page never
       flashes the wrong ground. Dark is the default when nothing is stored. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sk-theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Same engine as the homepage; only the hero copy differs. -->
  <script type="application/json" id="homeBoot">
  {
    "eyebrow": "404",
    "title": "That page doesn't exist.",
    "lede": "The link may be out of date, or the address slightly off. Everything I've built is below."
  }
  </script>

  <script src="/shared/core/catalog.js?v=2"></script>
  <script src="/shared/core/site.js?v=3"></script>
  <script src="/shared/core/i18n.js?v=5"></script>
  <script src="/shared/core/chrome.js?v=4"></script>
  <script src="/shared/core/home/home.js?v=3"></script>
  <script src="/shared/core/search.js?v=2"></script>
  <script src="/shared/core/nav.js"></script>
</body>
</html>
